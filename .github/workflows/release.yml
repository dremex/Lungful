name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Addon tests
        run: luajit tests/run.lua
      - name: Package the addon
        run: tools/package-addon.sh "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tools/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "dist/Lungful-$version.zip" \
            --title "Lungful $version" --notes-file "$RUNNER_TEMP/notes.md"
