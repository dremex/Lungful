name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lua formatting (StyLua)
        run: tools/format.sh --check
      - name: Addon tests
        run: luajit tests/run.lua
      - name: Package the addon
        run: tools/package-addon.sh
